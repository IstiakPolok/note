name: Daily Pattern Commit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make pattern commits
        run: |
          git config user.name "IstiakPolok"
          git config user.email "180335479+IstiakPolok@users.noreply.github.com"
          LEVELS=(1 2 3 4 3 2 1 4 3 2 1 2 3 4 1 2 3 4 3 2 1 4 3 2 1 2 3 4)
          COMMITS=(0 1 3 6 10)
          DAYS=$(( $(date +%s) / 86400 ))
          IDX=$(( (DAYS + 4) % 28 ))
          N=${COMMITS[${LEVELS[$IDX]}]}
          for i in $(seq 1 $N); do
            git commit --allow-empty -m "pattern $(date +%F) #$i"
          done
          git push
